<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass+ — Connect (error)</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .connect-canvas {
    grid-area: main;
    background: radial-gradient(1200px 600px at 50% 0%, #FFF5EE 0%, transparent 60%), var(--surface-0);
    display: grid;
    place-items: center;
    padding: 40px;
    overflow: auto;
  }
  .connect-card {
    width: 720px;
    background: var(--surface-1);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    padding: 36px 36px 24px;
  }
  .connect-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .connect-brand .brand-mark { width: 28px; height: 28px; border-radius: 7px; }
  .connect-brand .brand-word { font-size: 18px; }
  .connect-title { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.015em; font-weight: 600; margin: 0 0 4px; }
  .connect-sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .uri-group { margin-bottom: 16px; }
  .uri-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .uri-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .uri-field { height: 40px; padding: 0 14px; border-radius: var(--r-md); }
  .uri-field input { font-size: 13px; }

  .error-line {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 10px;
    padding: 10px 12px;
    background: #FEF2F2;
    border-radius: var(--r-md);
    color: #991B1B;
  }
  .error-line .ic {
    width: 16px; height: 16px;
    color: var(--danger);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .error-line .msg { font-size: 12.5px; line-height: 1.5; }
  .error-line .msg strong { color: #7F1D1D; }
  .error-line .msg code {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: rgba(220, 38, 38, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .recent-section { margin-top: 8px; padding-top: 18px; border-top: 1px solid var(--hairline); }
  .recent-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .recent-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; }
  .recent-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center; gap: 12px;
    padding: 9px 12px;
    border-radius: var(--r-md);
  }
  .recent-row:hover { background: var(--surface-hover); }
  .recent-row .meta { min-width: 0; }
  .recent-row .name { font-weight: 600; font-size: 13px; }
  .recent-row .host { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-row .when { font-size: 11px; color: var(--muted-2); }

  .connect-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--hairline);
  }
  .footer-actions { display: flex; gap: 8px; }
  .btn-lg { height: 36px; padding: 0 18px; font-size: 13px; }
  .help { font-size: 12px; color: var(--muted); }
  .help a { color: var(--primary-700); text-decoration: none; font-weight: 500; }

  .diag-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .diag-card {
    background: var(--surface-3);
    border-radius: var(--r-md);
    padding: 10px 12px;
  }
  .diag-card .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted-2);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .diag-card .val {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg);
    display: flex; align-items: center; gap: 6px;
  }
</style>
</head>
<body>
<script src="../assets/shell.js"></script>
<script>
Shell.mount({
  root: document.body,
  title: 'Compass+ — Connect',
  noShell: true,
  body: `
    <div class="connect-canvas">
      <div class="connect-card">
        <div class="connect-brand">
          <span class="brand-mark"></span>
          <span class="brand-word">Compass<span class="brand-plus">+</span></span>
        </div>
        <h1 class="connect-title">Connect to MongoDB</h1>
        <p class="connect-sub">We couldn't reach this cluster. Check the host or your credentials, then retry.</p>

        <div class="uri-group">
          <div class="uri-head">
            <span class="uri-label">Connection URI</span>
            <span class="pill is-danger">Authentication failed</span>
          </div>
          <div class="field is-mono uri-field is-danger">
            <span class="field-lbl">mongodb+srv://</span>
            <input value="admin:••••••••@app.5kx2.mongodb.net/app_prod" spellcheck="false">
          </div>

          <div class="error-line">
            <span class="ic">
              <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1.5 14.5 13H1.5L8 1.5Z" fill="currentColor" opacity="0.18"/><path d="M8 1.5 14.5 13H1.5L8 1.5Z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="M8 6v3M8 11v0.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <span class="msg">
              <strong>MongoServerError: bad auth — authentication failed.</strong>
              The user <code>admin</code> isn't authorised on <code>app_prod</code>. Verify the password or check whether the user has the <code>readWrite</code> role on this database.
            </span>
          </div>

          <div class="diag-row">
            <div class="diag-card">
              <div class="lbl">DNS</div>
              <div class="val"><span class="dot is-success"></span>resolved · 24ms</div>
            </div>
            <div class="diag-card">
              <div class="lbl">TLS handshake</div>
              <div class="val"><span class="dot is-success"></span>OK · TLS 1.3</div>
            </div>
            <div class="diag-card">
              <div class="lbl">Authentication</div>
              <div class="val"><span class="dot is-danger"></span>SCRAM‑SHA‑256 failed</div>
            </div>
          </div>
        </div>

        <div class="recent-section">
          <div class="recent-head">
            <span class="h-eyebrow">Recent connections · 7</span>
            <span class="muted" style="font-size:11.5px;">Sorted by last opened</span>
          </div>
          <div class="recent-list">
            <div class="recent-row">
              <span class="dot is-danger"></span>
              <span class="meta">
                <div class="name">production-cluster</div>
                <div class="host">mongodb+srv://app.5kx2.mongodb.net/app_prod</div>
              </span>
              <span class="when">just now</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row">
              <span class="dot is-success"></span>
              <span class="meta">
                <div class="name">staging</div>
                <div class="host">mongodb://staging-2.internal:27017/app_stg</div>
              </span>
              <span class="when">2 h ago</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row">
              <span class="dot is-warning"></span>
              <span class="meta">
                <div class="name">eu-analytics-replica</div>
                <div class="host">mongodb+srv://eu-1.analytics.mongodb.net/events</div>
              </span>
              <span class="when">yesterday</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
          </div>
        </div>

        <div class="connect-footer">
          <span class="help">Still stuck? <a href="#">Open the connection log ↗</a></span>
          <div class="footer-actions">
            <button class="btn btn-lg">Edit URI</button>
            <button class="btn btn-primary btn-lg">Retry</button>
          </div>
        </div>
      </div>
    </div>
  `
});
</script>
</body>
</html>
