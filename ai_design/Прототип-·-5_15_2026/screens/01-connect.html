<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass+ — Connect</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .connect-canvas {
    grid-area: main;
    background: radial-gradient(1200px 600px at 50% 0%, #FFF5EE 0%, transparent 60%), var(--surface-0);
    display: grid;
    place-items: center;
    padding: 40px;
    overflow: auto;
  }
  .connect-card {
    width: 720px;
    background: var(--surface-1);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    padding: 36px 36px 24px;
    position: relative;
  }
  .connect-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .connect-brand .brand-mark { width: 28px; height: 28px; border-radius: 7px; }
  .connect-brand .brand-word { font-size: 18px; }
  .connect-title {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: -0.015em;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .connect-sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 22px;
  }
  .uri-group { margin-bottom: 16px; }
  .uri-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .uri-field {
    height: 40px;
    padding: 0 14px;
    border-radius: var(--r-md);
  }
  .uri-field.is-focus { background: var(--surface-1); }
  .uri-field input { font-size: 13px; }
  .save-row {
    display: flex; align-items: center; gap: 10px;
    margin: 14px 0 22px;
    color: var(--muted);
    font-size: 12.5px;
  }
  .toggle {
    width: 32px; height: 18px;
    border-radius: 999px;
    background: var(--primary);
    position: relative;
    flex: none;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
  }
  .toggle::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    top: 2px; left: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: left 0.18s ease;
  }
  .toggle.is-off { background: #C8C2B7; }
  .toggle.is-off::after { left: 2px; }

  .recent-section {
    margin-top: 8px;
    padding-top: 18px;
    border-top: 1px solid var(--hairline);
  }
  .recent-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .recent-head .h-eyebrow { color: var(--muted-2); }
  .recent-list {
    display: flex; flex-direction: column; gap: 4px;
  }
  .recent-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--r-md);
    transition: background 0.12s ease;
  }
  .recent-row:hover { background: var(--surface-hover); }
  .recent-row .meta { min-width: 0; }
  .recent-row .name { font-weight: 600; font-size: 13px; }
  .recent-row .host {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-row .when {
    font-size: 11px;
    color: var(--muted-2);
    font-variant-numeric: tabular-nums;
  }
  .connect-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
  }
  .connect-footer .help {
    font-size: 12px;
    color: var(--muted);
  }
  .connect-footer .help a {
    color: var(--primary-700);
    text-decoration: none;
    font-weight: 500;
  }
  .footer-actions { display: flex; gap: 8px; }
  .btn-lg { height: 36px; padding: 0 18px; font-size: 13px; }
</style>
</head>
<body>
<script src="../assets/shell.js"></script>
<script>
Shell.mount({
  root: document.body,
  title: 'Compass+ — Connect',
  noShell: true,
  body: `
    <div class="connect-canvas">
      <div class="connect-card">
        <div class="connect-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-word">Compass<span class="brand-plus">+</span></span>
        </div>
        <h1 class="connect-title">Connect to MongoDB</h1>
        <p class="connect-sub">Paste a connection string or pick a recent cluster. Compass+ never stores credentials in plain text.</p>

        <div class="uri-group">
          <div class="uri-label">Connection URI</div>
          <div class="field is-mono uri-field is-focus">
            <span class="field-lbl">mongodb+srv://</span>
            <input value="admin:••••••••@app.5kx2.mongodb.net/app_prod?retryWrites=true&w=majority" spellcheck="false">
            <span class="pill is-info is-mono">SRV</span>
          </div>
        </div>

        <div class="save-row">
          <span class="toggle" role="switch" aria-checked="true"></span>
          <span style="color:var(--fg-soft);font-weight:500;">Save connection</span>
          <span style="margin-left:auto;font-family:var(--font-mono);font-size:11px;">Favorite color
            <span class="dot is-success" style="margin-left:6px;vertical-align:middle;"></span>
            <span class="dot is-info" style="margin-left:4px;vertical-align:middle;opacity:0.4;"></span>
            <span class="dot is-warning" style="margin-left:4px;vertical-align:middle;opacity:0.4;"></span>
          </span>
        </div>

        <div class="recent-section">
          <div class="recent-head">
            <span class="h-eyebrow">Recent connections · 7</span>
            <span class="muted" style="font-size:11.5px;">Sorted by last opened</span>
          </div>
          <div class="recent-list">
            <div class="recent-row">
              <span class="dot is-success"></span>
              <span class="meta">
                <div class="name">production-cluster</div>
                <div class="host">mongodb+srv://app.5kx2.mongodb.net/app_prod</div>
              </span>
              <span class="when">8 min ago</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row" style="background:var(--surface-hover);">
              <span class="dot is-success"></span>
              <span class="meta">
                <div class="name">staging</div>
                <div class="host">mongodb://staging-2.internal:27017/app_stg</div>
              </span>
              <span class="when">2 h ago</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row">
              <span class="dot is-warning"></span>
              <span class="meta">
                <div class="name">eu-analytics-replica</div>
                <div class="host">mongodb+srv://eu-1.analytics.mongodb.net/events</div>
              </span>
              <span class="when">yesterday</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row">
              <span class="dot is-muted"></span>
              <span class="meta">
                <div class="name">localhost</div>
                <div class="host">mongodb://localhost:27017</div>
              </span>
              <span class="when">3 days ago</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row">
              <span class="dot is-danger"></span>
              <span class="meta">
                <div class="name">archived-2024-q4</div>
                <div class="host">mongodb+srv://archive.5kx2.mongodb.net/archive</div>
              </span>
              <span class="when">12 Apr</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row">
              <span class="dot is-success"></span>
              <span class="meta">
                <div class="name">backup-readonly</div>
                <div class="host">mongodb://reader:••••@backup.internal:27017/snap</div>
              </span>
              <span class="when">28 Mar</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
            <div class="recent-row">
              <span class="dot is-muted"></span>
              <span class="meta">
                <div class="name">sandbox</div>
                <div class="host">mongodb://localhost:27018/test</div>
              </span>
              <span class="when">3 Feb</span>
              <button class="btn btn-ghost">Connect</button>
            </div>
          </div>
        </div>

        <div class="connect-footer">
          <span class="help">First time? <a href="#">Read the URI guide ↗</a></span>
          <div class="footer-actions">
            <button class="btn btn-lg">Advanced…</button>
            <button class="btn btn-primary btn-lg">Connect</button>
          </div>
        </div>
      </div>
    </div>
  `
});
</script>
</body>
</html>
