<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass+ — Explorer · app_prod.users</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .canvas {
    grid-area: main;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    min-height: 0;
  }
  .filter-bar { padding: 10px 16px 14px; background: var(--surface-1); }
  .filter-well {
    display: grid;
    grid-template-columns: 2.2fr 1fr 1.4fr auto auto;
    gap: 6px;
    align-items: center;
    background: var(--surface-3);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-inset);
    padding: 6px;
  }
  .filter-well .field { background: transparent; box-shadow: none; height: 32px; }
  .filter-well .field.is-focus { background: var(--surface-1); box-shadow: 0 0 0 2px var(--primary-50), 0 0 0 3px var(--primary); border-radius: var(--r-md); }
  .results-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px 12px;
    background: var(--surface-1);
  }
  .results-toolbar .meta {
    font-size: 12px;
    color: var(--muted);
    margin-left: 4px;
  }
  .results-toolbar .meta strong { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }

  .docs {
    overflow: auto;
    padding: 12px 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface-0);
  }
  .doc-card {
    background: var(--surface-1);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    padding: 12px 14px 12px 10px;
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 8px;
  }
  .doc-card.is-hover { background: var(--surface-hover); box-shadow: var(--shadow-md); }
  .doc-card .twist {
    color: var(--muted-2);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 3px;
    font-size: 11px;
    cursor: default;
  }
  .doc-card.is-open .twist { transform: rotate(90deg); transform-origin: 50% 7px; }
  .doc-head {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .doc-id {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: var(--surface-3);
    padding: 2px 8px;
    border-radius: 999px;
    color: var(--fg-soft);
  }
  .doc-meta { color: var(--muted); font-size: 11.5px; font-family: var(--font-mono); }

  .kv {
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--fg-soft);
  }
  .kv .k { color: #1F4D8C; }
  .kv .s { color: #15803D; }
  .kv .n { color: #B45309; }
  .kv .b { color: #6D28D9; }
  .kv .null { color: var(--muted-2); }
  .kv .o { color: var(--muted); }
  .kv .row { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: baseline; }
  .kv .nest { padding-left: 16px; border-left: 1px dashed var(--hairline); margin-left: 6px; }
  .kv .type-tag {
    display: inline-block;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted-2);
    margin-left: 6px;
    font-weight: 600;
    font-family: var(--font-ui);
  }

  .pager {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--surface-1);
    color: var(--muted);
    font-size: 12px;
  }
  .pager .pgnum {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    font-weight: 600;
  }
  .pager .pgctrl {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--surface-3);
    padding: 2px;
    border-radius: var(--r-md);
    box-shadow: var(--shadow-inset);
  }
  .pager .pgctrl .btn { height: 26px; padding: 0 9px; font-size: 12px; }
</style>
</head>
